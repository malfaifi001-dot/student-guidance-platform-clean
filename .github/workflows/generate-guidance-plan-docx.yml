name: Generate Guidance Plan DOCX

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/generate-guidance-plan-docx.yml'
      - 'scripts/generate_guidance_plan_docx.py'

permissions:
  contents: read

jobs:
  build-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install python-docx
      - name: Generate Word file
        run: python scripts/generate_guidance_plan_docx.py
      - name: Upload Word file
        uses: actions/upload-artifact@v4
        with:
          name: guidance-plan-docx
          path: generated-documents/*.docx
          retention-days: 3
